[project]
name = "scholia-a2a"
version = "0.1.0"
description = "Reference implementation of the Scholia Provenance Extension for A2A (draft 0.1)"
requires-python = ">=3.11"
dependencies = ["a2a-sdk[http-server]==1.2.1", "scholialang==0.7.2", "cryptography", "jsonschema", "httpx", "uvicorn", "starlette"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["scholia_a2a*"]

[tool.setuptools.package-data]
scholia_a2a = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
